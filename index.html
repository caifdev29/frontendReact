<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth AWS Frontend</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="auth-container">
    <!-- SECCIÓN DE REGISTRO -->
    <section id="register-section">
      <h2>Crear Cuenta</h2>
      <form id="register-form">
        <input type="text" id="reg-name" placeholder="Nombre completo">
        <input type="text" id="reg-user" placeholder="Nombre de usuario" required>
        <input type="email" id="reg-email" placeholder="Correo electrónico" required>
        <input type="password" id="reg-pass" placeholder="Contraseña" required>
        <button type="submit">Registrarse</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="#" onclick="toggleView('login')">Inicia sesión</a></p>
    </section>

    <!-- SECCIÓN DE LOGIN -->
    <section id="login-section" style="display:none;">
      <h2>Iniciar Sesión</h2>
      <form id="login-form">
        <input type="text" id="log-user" placeholder="Nombre de usuario" required>
        <input type="password" id="log-pass" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
      </form>
      <p>¿No tienes cuenta? <a href="#" onclick="toggleView('register')">Regístrate</a></p>
    </section>
  </div>

  <!-- PÁGINA DE ACCESO TEMPORAL (DASHBOARD) -->
  <div id="dashboard-section" style="display:none;">
    <h1>Bienvenido al Panel de Control</h1>
    <p id="user-info"></p>
    <button onclick="getPrivateData()">Probar Ruta Privada</button>
    <button onclick="logout()" style="background-color: #ff4444;">Cerrar Sesión</button>
    <pre id="api-response"></pre>
  </div>

  <script src="script.js"></script>
</body>

</html>
